apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-demo
  namespace: django-demo
  labels:
    app.kubernetes.io/name: django-demo
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: django-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: django-demo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-demo
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: django-demo
    spec:
      containers:
        - name: django-demo
          image: verrve/django-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: django-demo-config
            - secretRef:
                name: django-demo-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-demo-nginx
  namespace: django-demo
  labels:
    app.kubernetes.io/part-of: django-demo
    app.kubernetes.io/component: static
    app.kubernetes.io/name: django-demo-nginx
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/part-of: django-demo
      app.kubernetes.io/component: static
      app.kubernetes.io/name: django-demo-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: django-demo
        app.kubernetes.io/component: static
        app.kubernetes.io/name: django-demo-nginx
    spec:
      containers:
        - name: django-demo-nginx
          image: verrve/django-demo-nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          #securityContext:
          #  runAsNonRoot: true
          #  allowPrivilegeEscalation: false
          #  capabilities:
          #    drop:
          #      - ALL
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-default-conf
